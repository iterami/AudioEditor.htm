<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>AudioEditor.htm</title>
<link href=../common/css/core.css rel=stylesheet>

<button class=medium id=audio_play type=button>Play</button>
<table>
  <tr>
    <td>Duration
    <td><input id=duration min=0 step=any type=number>
  <tr>
    <td>Frequency
    <td><input id=frequency min=0 step=any type=number>
  <tr>
    <td>Type
    <td><select id=type>
      <option value=sawtooth>sawtooth
      <option value=sine>sine
      <option value=square>square
      <option value=triangle>triangle
    </select>
  <tr>
    <td>Volume
    <td><input id=volume min=0 step=any type=number>
  <tr class=header>
    <td>AudioContext
    <td>Properties
  <tr>
    <td>baseLatency
    <td id=baseLatency>
  <tr>
    <td>currentTime
    <td id=currentTime>
  <tr>
    <td>outputLatency
    <td id=outputLatency>
  <tr>
    <td>sampleRate
    <td id=sampleRate>
  <tr>
    <td>state
    <td id=state>
  <tr class=header>
    <td>Destination
    <td>Properties
  <tr>
    <td>channelCount
    <td id=channelCount>
  <tr>
    <td>channelCountMode
    <td id=channelCountMode>
  <tr>
    <td>channelInterpretation
    <td id=channelInterpretation>
  <tr>
    <td>maxChannelCount
    <td id=maxChannelCount>
  <tr>
    <td>numberOfInputs
    <td id=numberOfInputs>
  <tr>
    <td>numberOfOutputs
    <td id=numberOfOutputs>
</table>

<script src=../common/js/core.js></script>
<script src=../common/js/audio.js></script>
<script src=repo.js></script>
